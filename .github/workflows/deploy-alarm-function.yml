# 알람 함수 자동 배포 (2026-11-09 대표님 지시 "언제든 지시하면 알아서 올릴 수 있게")
#
# main 에 push 할 때 supabase/functions/ 아래가 바뀌었으면 시험을 돌린 뒤
# Supabase Edge Function `sec-send-alarms` 를 Ai-office 프로젝트에 올립니다.
# GitHub 저장소 화면 → Actions → "알람 함수 배포" → Run workflow 로 손으로도 돌릴 수 있습니다.
#
# 필요한 것: 저장소 Settings → Secrets and variables → Actions 의 SUPABASE_ACCESS_TOKEN
#   (Supabase 를 GitHub `Ai-office-mcare` 로 로그인 → Account → Access Tokens 에서 만든 토큰. 값은 채팅·코드에 쓰지 않음)

name: 알람 함수 배포

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "tests/plan.test.mjs"
      - ".github/workflows/deploy-alarm-function.yml"
  workflow_dispatch:

concurrency:
  group: deploy-alarm-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nadsaldjxviuvfbzglxl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 알람 계산 시험
        run: node --test tests/plan.test.mjs

      - name: 토큰이 있는지 확인
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::저장소 비밀 SUPABASE_ACCESS_TOKEN 이 없어 함수 배포는 건너뜁니다(시험만 함). 대시보드로 올리세요 — docs/SETUP.md."
            echo "have=no" >> "$GITHUB_OUTPUT"
          else
            echo "have=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.have == 'yes'
        with:
          version: latest

      - name: sec-send-alarms 올리기 (JWT 검증 끔 — 함수가 x-cron-secret 으로 직접 확인)
        if: steps.token.outputs.have == 'yes'
        run: supabase functions deploy sec-send-alarms --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
